# TMC-Tongue 数据集配置（21 类，与发布版 classes.txt 一致）
# 数据集获取方式见 README.md「数据集来源」；解压后把 path 改为你的实际路径
path: ./shezhenv3-coco
train: train/images
val: val/images
test: test/images

nc: 21
names:
