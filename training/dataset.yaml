  6: hongdianshe    # 红点舌
  7: liewenshe      # 裂纹舌
  8: chihenshe      # 齿痕舌
  9: baitaishe      # 白苔
  10: huangtaishe   # 黄苔
  11: heitaishe     # 黑苔
  12: huataishe     # 滑苔
  13: shenquao      # 肾区凹
  14: shenqutu      # 肾区凸（全数据集仅 1 例）
  15: gandanao      # 肝胆区凹
  16: gandantu      # 肝胆区凸（全数据集仅 1 例）
  17: piweiao       # 脾胃区凹
  18: piweitu       # 脾胃区凸（空类，发布版无标注实例）
